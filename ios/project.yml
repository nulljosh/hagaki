name: Hagaki
options:
  bundleIdPrefix: com.nulljosh
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
  xcodeVersion: "26.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "202610041030"
targets:
  Hagaki:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: App
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nulljosh.sieve
        INFOPLIST_FILE: App/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEVELOPMENT_TEAM: QMM486NPYC
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Hagaki.entitlements
        CODE_SIGN_ENTITLEMENTS[sdk=macosx*]: Hagaki-macOS.entitlements
  HagakiTests:
    type: bundle.unit-test
    supportedDestinations: [iOS, macOS]
    sources:
      - path: Tests
    dependencies:
      - target: Hagaki
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nulljosh.sieve.tests
        "TEST_HOST[sdk=macosx*]": $(BUILT_PRODUCTS_DIR)/Hagaki.app/Contents/MacOS/Hagaki
        GENERATE_INFOPLIST_FILE: YES
        DEVELOPMENT_TEAM: QMM486NPYC
schemes:
  Hagaki:
    build:
      targets:
        Hagaki: all
        HagakiTests: [test]
    test:
      targets:
        - HagakiTests
    run:
      config: Debug
    archive:
      config: Release
    shared: true
